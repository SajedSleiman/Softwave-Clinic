<aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
        <div class="logo" (click)="sidebarCollapsed && toggleSidebar()" [class.clickable]="sidebarCollapsed" title="Expand Sidebar">
            <div class="logo-icon">
                <img src="soft-clinic.png" alt="Logo">
            </div>
            <div class="logo-text" *ngIf="!sidebarCollapsed">
                <span class="brand-title">SoftClinic</span>
                <span class="brand-subtitle">Softwave CS</span>
            </div>
        </div>

        <!-- Toggle icon button only visible when expanded -->
        <button class="toggle-btn" (click)="toggleSidebar()" title="Collapse Sidebar" *ngIf="!sidebarCollapsed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-menu">
        <div class="menu-section">
            <a href="javascript:void(0)" class="menu-item active" (click)="sidebarCollapsed ? toggleSidebar() : null" title="Patients">
                <span class="icon"><img src="patients.png" alt="Patients"></span>
                <span class="label" *ngIf="!sidebarCollapsed">Patients</span>
            </a>
            <a href="javascript:void(0)" class="menu-item" (click)="sidebarCollapsed ? toggleSidebar() : null" title="Doctors">
                <span class="icon"><img src="doctor.png" alt="Doctors"></span>
                <span class="label" *ngIf="!sidebarCollapsed">Doctors</span>
            </a>
            <a href="javascript:void(0)" class="menu-item" (click)="sidebarCollapsed ? toggleSidebar() : null" title="Acts">
                <span class="icon"><img src="doctor.png" alt="Acts"></span>
                <span class="label" *ngIf="!sidebarCollapsed">Acts</span>
            </a>
        </div>

        <div class="menu-section">
            <div class="menu-header-dropdown" (click)="toggleReminders()" *ngIf="!sidebarCollapsed">
                <span>Reminders</span>
                <span class="dropdown-arrow" [class.expanded]="remindersExpanded">▼</span>
            </div>
            <div class="submenu" *ngIf="remindersExpanded && !sidebarCollapsed">
                <a href="#" class="menu-item">
                    <span class="icon"><img src="notifications.png" alt="Appointments"></span>
                    <span class="label">Doctor Appointment</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="icon"><img src="currency.svg" alt="Balance"></span>
                    <span class="label">Balance Reminder</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="icon"><img src="currency.svg" alt="Notes"></span>
                    <span class="label">General Note</span>
                </a>
            </div>
        </div>

        <div class="menu-section">
            <div class="menu-header-dropdown" (click)="toggleUsers()" *ngIf="!sidebarCollapsed">
                <span>Users</span>
                <span class="dropdown-arrow" [class.expanded]="usersExpanded">▼</span>
            </div>
            <div class="submenu" *ngIf="usersExpanded && !sidebarCollapsed">
                <a href="#" class="menu-item">
                    <span class="icon"><img src="notifications.png" alt="Users Patients"></span>
                    <span class="label">Users - Patients</span>
                </a>
                <a href="#" class="menu-item">
                    <span class="icon"><img src="currency.svg" alt="Users Admins"></span>
                    <span class="label">Users - Admins</span>
                </a>
            </div>
        </div>

        <div class="menu-section">
            <a href="javascript:void(0)" class="menu-item" (click)="sidebarCollapsed ? toggleSidebar() : null" title="Social Zone">
                <span class="icon"><img src="currency.svg" alt="Social Zone"></span>
                <span class="label" *ngIf="!sidebarCollapsed">Social Zone</span>
            </a>
        </div>
    </nav>

    <!-- Footer Profile -->
    <div class="sidebar-footer">
        <div class="user-profile" (click)="sidebarCollapsed ? toggleSidebar() : null" [class.clickable]="sidebarCollapsed" title="Slaymane AH">
            <img src="profile.jpg" alt="Profile" class="profile-pic">
            <div class="user-info" *ngIf="!sidebarCollapsed">
                <div class="user-name">Slaymane AH</div>
                <div class="user-role">Administrator</div>
            </div>
        </div>
    </div>
</aside>
