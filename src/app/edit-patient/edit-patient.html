    <main class="main-content">
        <header class="top-headbar">
            <div class="header-title">
                <h1>Edit Patient</h1>
                <p>Update patient file details</p>
            </div>
            <div class="header-buttons">
                <button type="button" class="delete-btn-text" (click)="deletePatient()" [disabled]="loading || deleting">
                    {{ deleting ? 'Deleting...' : 'Delete' }}
                </button>
                <button type="button" class="discard-btn" (click)="discard()" [disabled]="loading || deleting">Discard</button>
                <button type="button" class="save-btn" (click)="savePatient()" [disabled]="loading || deleting">
                    {{ loading ? 'Saving...' : 'Save' }}
                </button>
            </div>
        </header>

        <div class="add-patient-container">
            <div *ngIf="error" class="error-banner">
                {{ error }}
            </div>

            <form [formGroup]="patientForm" class="patient-form" (ngSubmit)="savePatient()">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>File Number</label>
                            <input type="text" formControlName="fileNumber" class="disabled-input" readonly>
                        </div>
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" formControlName="firstName" placeholder="Enter first name">
                        </div>
                        <div class="form-group">
                            <label>Father Name *</label>
                            <input type="text" formControlName="fatherName" placeholder="Enter father name">
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" formControlName="lastName" placeholder="Enter last name">
                        </div>
                        <div class="form-group">
                            <label>Date Of Birth</label>
                            <input type="date" formControlName="dateOfBirth">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select formControlName="genderCode">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Nationality</label>
                            <select formControlName="nationalityCode">
                                <option value="Lebanese">Lebanese</option>
                                <option value="Syrian">Syrian</option>
                                <option value="Palestinian">Palestinian</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>ID Number</label>
                            <input type="text" formControlName="identityNumber" placeholder="Enter ID or Passport number">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Contact Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Phone 1 *</label>
                            <input type="tel" formControlName="phone1" placeholder="e.g. +96171040522">
                        </div>
                        <div class="form-group">
                            <label>Phone 2</label>
                            <input type="tel" formControlName="phone2" placeholder="e.g. +9617145567">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" formControlName="email" placeholder="e.g. slaymane@gmail.com">
                        </div>
                        
                        <div class="form-group address-field">
                            <label>Address Details</label>
                            <input type="text" formControlName="addressLine" placeholder="Enter full address">
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" formControlName="city" placeholder="Enter city">
                        </div>
                        <div class="form-group">
                            <label>Country</label>
                            <select formControlName="countryCode">
                                <option value="Lebanon">Lebanon</option>
                                <option value="Syria">Syria</option>
                                <option value="Palestine">Palestine</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Account & Financial</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Balance in USD</label>
                            <div class="input-with-prefix balance-style">
                                <span class="prefix">$</span>
                                <input type="number" formControlName="balanceUSD" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Balance in LBP</label>
                            <div class="input-with-prefix balance-style">
                                <span class="prefix">L.L</span>
                                <input type="number" formControlName="balanceLBP" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Paid this month in USD</label>
                            <div class="input-with-prefix paid-style">
                                <span class="prefix">$</span>
                                <input type="number" formControlName="paidThisMonthUSD" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Paid this month in LBP</label>
                            <div class="input-with-prefix paid-style">
                                <span class="prefix">L.L</span>
                                <input type="number" formControlName="paidThisMonthLBP" readonly>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
